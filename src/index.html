<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Wallboard</title>
    <!--
      Self-hosted, not a CDN link: this used to load from jsDelivr, which
      meant an internet/CDN outage silently removed every icon on a board
      with no offline fallback, and the request had no Subresource
      Integrity check. Now bundled via the @tabler/icons-webfont npm
      dependency (see angular.json's "assets" glob, which copies
      tabler-icons.min.css + the base-weight font files into
      assets/tabler-icons/ at build time) and served from the same origin
      as everything else. Version is still pinned deliberately — bump the
      npm dependency, not this path, and re-verify the icon set renders.
    -->
    <link rel="stylesheet" href="assets/tabler-icons/tabler-icons.min.css" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
