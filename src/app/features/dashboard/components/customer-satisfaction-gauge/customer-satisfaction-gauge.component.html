<div class="panel">
  <app-meter
    label="CSAT"
    icon="ti-mood-smile"
    [value]="hasData() ? metrics()!.csatScore : 0"
    [max]="maxScore"
    [displayValue]="displayValue()"
    [colorVar]="csatColor()"
    [iconBgVar]="csatIconBg()"
    [severity]="csatSeverity()"
    [statusLabel]="statusLabel()"
    [warningValue]="warningValue()"
    [criticalValue]="criticalValue()"
  />
</div>
