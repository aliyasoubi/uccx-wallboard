<div class="card">
  @if (showPhoto()) {
    <img [src]="agent()!.photoUrl" alt="" class="photo" (error)="onPhotoError()" />
  } @else {
    <div class="photo photo--fallback">{{ initials() }}</div>
  }
  <div class="info">
    <p class="eyebrow">
      <i class="ti ti-trophy title-icon" aria-hidden="true"></i>Agent of the month
    </p>
    <p class="name">{{ agent()?.name ?? '—' }}</p>
  </div>
</div>
