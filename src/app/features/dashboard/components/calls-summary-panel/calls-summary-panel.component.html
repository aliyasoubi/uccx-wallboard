<div class="panel">
  <app-metric-tile label="Total calls" [value]="summary()?.totalCalls ?? '—'" />
  <app-metric-tile label="Handled" [value]="summary()?.handledCalls ?? '—'" />
  <app-metric-tile
    label="Abandoned"
    [value]="summary()?.abandonedCalls ?? '—'"
    [severity]="abandonedSeverity()"
  />
  <app-metric-tile
    label="Avg wait"
    [value]="(summary()?.avgWaitSeconds | formatDuration)"
    [severity]="waitSeverity()"
  />
  <app-metric-tile
    label="Avg talk"
    [value]="(summary()?.avgTalkSeconds | formatDuration)"
    [severity]="talkSeverity()"
  />
</div>
