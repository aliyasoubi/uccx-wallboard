<div class="panel">
  <p class="title"><i class="ti {{ icon }} title-icon" [style.color]="iconColorVar" aria-hidden="true"></i>{{ title }}</p>
  @if (top(); as leader) {
    <p class="value">{{ leader.value }}</p>
    <p class="agent-name">{{ leader.agentName }}</p>
  } @else {
    <p class="empty">No data yet</p>
  }
</div>
