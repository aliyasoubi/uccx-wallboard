<div class="group-card">
  <p class="section-label">Calls Summary</p>
  <div class="grid">
    <app-metric-tile
      icon="ti-phone-incoming"
      iconColorVar="var(--color-status-accent)"
      label="Incoming"
      [value]="summary()?.totalCalls ?? '—'"
    />
    <app-metric-tile
      icon="ti-phone-outgoing"
      iconColorVar="var(--color-status-warning)"
      label="Outbound"
      [value]="outboundStats()?.count ?? '—'"
    />
    <app-metric-tile
      icon="ti-phone-check"
      iconColorVar="var(--color-status-normal)"
      label="Answered"
      [value]="summary()?.handledCalls ?? '—'"
    />
    <app-metric-tile
      icon="ti-phone-x"
      iconColorVar="var(--color-status-critical)"
      label="Abandoned"
      [value]="summary()?.abandonedCalls ?? '—'"
      [severity]="abandonedSeverity()"
    />
  </div>
</div>
