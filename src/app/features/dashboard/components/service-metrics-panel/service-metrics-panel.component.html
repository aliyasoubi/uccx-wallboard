<div class="panel">
  <app-metric-tile
    label="Calls in queue"
    [value]="callsWaiting()"
    [severity]="callsWaitingSeverity()"
    size="lg"
  />
  <app-meter
    label="SLA"
    [value]="metrics()?.slaPercent ?? 0"
    [max]="100"
    [displayValue]="(metrics()?.slaPercent ?? 0) + '%'"
    [colorVar]="slaColor()"
  />
  <app-meter
    label="CSAT"
    [value]="metrics()?.csatScore ?? 0"
    [max]="5"
    [displayValue]="(metrics()?.csatScore ?? 0).toFixed(1)"
    colorVar="var(--color-status-accent)"
  />
</div>
