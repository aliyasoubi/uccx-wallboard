<div class="group-card">
  <p class="section-label">KPI Metrics</p>
  <div class="grid">
    <app-metric-tile
      label="FCR"
      [value]="hasFcrData() ? serviceMetrics()!.fcrPercent + '%' : '—'"
      [severity]="fcrSeverity()"
    />
    <app-metric-tile
      label="AWD"
      [value]="(summary()?.avgWaitSeconds | formatDuration)"
      [severity]="awdSeverity()"
    />
    <app-metric-tile
      label="AHT"
      [value]="(summary()?.avgTalkSeconds | formatDuration)"
      [severity]="ahtSeverity()"
    />
    <!-- <app-metric-tile
      label="Calls in queue"
      [value]="summary()?.callsWaiting ?? '—'"
      [severity]="callsWaitingSeverity()"
    /> -->
  </div>
</div>
