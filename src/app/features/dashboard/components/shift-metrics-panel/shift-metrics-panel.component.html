<div class="panel">
  <p class="title">Shift metrics</p>
  <div class="metric">
    <p class="label">Avg handle time</p>
    <p class="value">{{ metrics()?.avgHandleSeconds | formatDuration }}</p>
  </div>
  <div class="metric">
    <p class="label">Total talk time (shift)</p>
    <p class="value">{{ metrics()?.totalTalkSeconds | formatDuration }}</p>
  </div>
</div>
