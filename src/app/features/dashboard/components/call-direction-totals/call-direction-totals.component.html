<div class="grid">
  <app-metric-tile
    icon="ti-phone-incoming"
    iconColorVar="var(--color-status-accent)"
    label="Total inbound calls"
    size="sm"
    [value]="summary()?.inboundTotalCalls ?? '—'"
  />
  <app-metric-tile
    icon="ti-phone-outgoing"
    iconColorVar="var(--color-status-warning)"
    label="Total outbound calls"
    size="sm"
    [value]="summary()?.outboundTotalCalls ?? '—'"
  />
  <app-metric-tile
    icon="ti-clock-play"
    iconColorVar="var(--color-status-accent)"
    label="Total inbound talk time"
    size="sm"
    [value]="summary()?.inboundTotalTalkTime | formatDurationLarge"
  />
  <app-metric-tile
    icon="ti-clock-play"
    iconColorVar="var(--color-status-warning)"
    label="Total outbound talk time"
    size="sm"
    [value]="summary()?.outboundTotalTalkTime | formatDurationLarge"
  />
</div>
