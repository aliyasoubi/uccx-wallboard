<div class="dashboard">
  <app-header />

  <div class="board">
    <!-- Column 1: call volume -> top performers -> service gauges -> KPIs -->
    <section class="column column--1">
      <app-call-summary-displays
        class="band band--summary"
        [summary]="store.callSummary()"
        [inboundStats]="store.inboundStats()"
        [outboundStats]="store.outboundStats()"
      />

      <app-top-agents class="band band--top-agents" [agents]="store.agents()" />

      <div class="band band--pair">
        <app-sla-gauge class="pair-item" [metrics]="store.serviceMetrics()" />
        <app-customer-satisfaction-gauge class="pair-item" [metrics]="store.serviceMetrics()" />
      </div>

      <app-kpi-metrics
        class="band band--kpi"
        [summary]="store.callSummary()"
        [serviceMetrics]="store.serviceMetrics()"
      />
    </section>

    <!-- Column 2: queue health -> org-wide inbound/outbound totals -->
    <section class="column column--2">
      <div class="band band--pair band--queues">
        @for (queue of store.queues(); track queue.name) {
          <app-queue-list class="pair-item" variant="waiting" [queue]="queue" />
        }
      </div>

      <!-- Agent State and Agent of the Month used to sit here. At the client's
           request this slot now shows the four org-wide direction totals, and
           Agent of the Month moved under Agent Summary in column 3 (below).
           AgentStateComponent is left in place (imported, tested, still fed by
           the store) but is no longer rendered — uncomment to bring it back. -->
      <!-- <div class="band band--pair band--agent-highlights">
        <app-agent-state class="pair-item" [summary]="store.agentStateSummary()" />
      </div> -->

      <app-call-direction-totals
        class="band band--direction-totals"
        [inboundStats]="store.inboundStats()"
        [outboundStats]="store.outboundStats()"
      />
    </section>

    <!-- Column 3: agent summary (fills) -> agents of the month -->
    <section class="column column--3">
      <app-agent-summary class="band band--fill" [agents]="store.agents()" />
      <app-agent-of-month
        class="band band--agents-of-month"
        [agents]="store.agentOfMonth()"
        [roster]="store.agents()"
      />
    </section>
  </div>

  <app-footer [connectionState]="store.connectionState()" [lastUpdated]="store.lastUpdated()" />
</div>
