<div
  class="tile"
  [class.tile--sm]="size() === 'sm'"
  [class.tile--lg]="size() === 'lg'"
  [class.tile--warning]="severity() === 'warning'"
  [class.tile--critical]="severity() === 'critical'"
  [style.background]="bgVar()"
>
  <p class="label">{{ label() }}</p>
  <p class="value" [style.color]="colorVar()">{{ value() }}</p>
  @if (icon()) {
    <i class="ti {{ icon() }} tile-icon" [style.color]="iconColorVar()" aria-hidden="true"></i>
  }
</div>
